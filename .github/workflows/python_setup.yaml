name: credential-requirement

on:
  push: {}

jobs:
  setup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - run: pip install pytest flake8

      - run: python --version

      - run: flake8 --version

      - run: pytest --version
